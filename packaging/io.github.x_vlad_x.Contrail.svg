<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="Contrail">
  <title>Contrail</title>
  <desc>Cloud-shaped chat bubble, ascending paper airplane and two white contrails on a blue GNOME-style app icon.</desc>
  <defs>
    <!-- The application's sculpted, two-level blue tile. -->
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#287bda"/>
      <stop offset=".66" stop-color="#125ec0"/>
      <stop offset="1" stop-color="#05448f"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2=".17" y2="1">
      <stop offset="0" stop-color="#54b1ff"/>
      <stop offset=".36" stop-color="#3298fc"/>
      <stop offset=".7" stop-color="#1d82ef"/>
      <stop offset="1" stop-color="#0e6ce4"/>
    </linearGradient>
    <linearGradient id="skyHighlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ddf3ff" stop-opacity=".27"/>
      <stop offset=".24" stop-color="#b2ddff" stop-opacity=".05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="bubble" cx=".2" cy=".05" r="1" fx=".22" fy=".04">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".35" stop-color="#e6f4ff"/>
      <stop offset=".64" stop-color="#8dccfb"/>
      <stop offset="1" stop-color="#5fb4f7"/>
    </radialGradient>
    <linearGradient id="bubbleShine" x1="0" y1="0" x2=".55" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".66"/>
      <stop offset=".47" stop-color="#ffffff" stop-opacity=".0"/>
      <stop offset="1" stop-color="#a0d7fb" stop-opacity=".11"/>
    </linearGradient>
    <linearGradient id="whiteCloud" x1="0" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".55" stop-color="#f6fbff"/>
      <stop offset="1" stop-color="#bce1fc"/>
    </linearGradient>
    <linearGradient id="leftCloud" x1="0" y1="0" x2=".85" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".99"/>
      <stop offset=".52" stop-color="#eef8ff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#c5e7fe" stop-opacity=".5"/>
    </linearGradient>
    <linearGradient id="trailUpper" x1="0" y1=".5" x2="1" y2="0">
      <stop offset="0" stop-color="#e0f2ff" stop-opacity=".68"/>
      <stop offset=".37" stop-color="#f5fcff" stop-opacity=".96"/>
      <stop offset=".92" stop-color="#fff"/>
      <stop offset="1" stop-color="#fff"/>
    </linearGradient>
    <linearGradient id="trailLower" x1="0" y1="1" x2=".9" y2="0">
      <stop offset="0" stop-color="#b9ddf9" stop-opacity=".28"/>
      <stop offset=".22" stop-color="#e8f6ff" stop-opacity=".95"/>
      <stop offset=".75" stop-color="#fff"/>
      <stop offset="1" stop-color="#fff"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#f9fcff"/>
    </linearGradient>
    <linearGradient id="paperFold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e7f4ff"/>
      <stop offset="1" stop-color="#a7d7fa"/>
    </linearGradient>
    <filter id="bubbleShadow" x="-30%" y="-30%" width="190%" height="190%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="2.0"/>
    </filter>
    <clipPath id="tileClip">
      <rect x="10.5" y="10.5" width="107" height="103.5" rx="26"/>
    </clipPath>
    <clipPath id="bubbleClip">
      <path d="M 55 29.5
               C 70.8 28.6 83.5 29.3 92.9 37.9
               L 91 39.7
               C 89.7 41 89.6 43.2 91.1 44.7
               C 92.8 46.4 91.4 47.4 90 48.5
               C 94.6 48.5 98.4 49.3 100.7 53.1
               C 105 60.4 104.7 69.2 100.7 77.2
               C 95.2 88.6 82.6 92.9 68.8 93.1
               L 58.2 93.1
               C 51.3 93.1 49 91.7 45.8 92
               C 42.7 92.1 38.6 95.6 33.6 97.8
               C 30.4 99.1 30.7 96.8 32.2 94.6
               C 34.2 91.9 36.8 86.4 35.1 84.7
               C 27.4 78.3 23.7 70.3 23.5 61.6
               C 23.2 45.7 35.7 31.1 55 29.5 Z"/>
    </clipPath>
  </defs>

  <!-- Bottom rim and the blue upper surface, as separate vector layers. -->
  <rect x="10.5" y="14" width="107" height="103.5" rx="26" fill="url(#base)"/>
  <rect x="10.5" y="10.5" width="107" height="103.5" rx="26" fill="url(#sky)"/>
  <g clip-path="url(#tileClip)">
    <path d="M 10.7 37 C 10.7 20 24.2 10.9 42.7 10.9 L 88 10.9
             C 109 10.9 117 23.9 117 40 L 117 15 L 10.5 15 Z"
          fill="url(#skyHighlight)"/>
    <path d="M 11 90 C 10.4 104 20.4 113.9 37 114.1 L 91 114.1
             C 108 113.8 117.1 104 117.3 88 L 117.4 116 L 10.5 116 Z"
          fill="#0750b0" opacity=".14"/>
  </g>

  <!-- Visible shadow under the message bubble silhouette. -->
  <g opacity="0.5" transform="translate(3.4 4.0)">
    <path d="M 55 29.5
               C 70.8 28.6 83.5 29.3 92.9 37.9
               L 91 39.7
               C 89.7 41 89.6 43.2 91.1 44.7
               C 92.8 46.4 91.4 47.4 90 48.5
               C 94.6 48.5 98.4 49.3 100.7 53.1
               C 105 60.4 104.7 69.2 100.7 77.2
               C 95.2 88.6 82.6 92.9 68.8 93.1
               L 58.2 93.1
               C 51.3 93.1 49 91.7 45.8 92
               C 42.7 92.1 38.6 95.6 33.6 97.8
               C 30.4 99.1 30.7 96.8 32.2 94.6
               C 34.2 91.9 36.8 86.4 35.1 84.7
               C 27.4 78.3 23.7 70.3 23.5 61.6
               C 23.2 45.7 35.7 31.1 55 29.5 Z"
          fill="#0a3f7c" filter="url(#bubbleShadow)"/>
  </g>

  <!-- Single, continuous speech-bubble silhouette including its lower-left tail. -->
  <g clip-path="url(#bubbleClip)">
    <rect x="21" y="27" width="86" height="73" fill="url(#bubble)"/>
    <path d="M 21 31 L 100 27 L 108 60
             C 85 31 65 27 49 32 C 31 38 24 51 22 67 Z"
          fill="url(#bubbleShine)"/>

    <!-- Soft little cloud layers inside the conversation bubble. -->
    <path d="M 19 60 C 20 56.5 25.5 54.5 31.7 54.3
             C 37.7 54.1 41.8 57.2 43 62.8
             C 48.5 59 54.4 64.1 53.2 71.6
             L 22 87 Z"
          fill="url(#leftCloud)"/>
    <path d="M 46 96 C 50 88 56.6 82.1 63.1 86.4
             C 65.8 79.5 71.9 76.8 77.2 78.4
             C 80 73.8 85.9 71.3 90.4 72.2
             C 94 67.9 99 67.2 104.5 70
             L 107 98 Z"
          fill="url(#whiteCloud)"/>
    <path d="M 25.2 77 C 50 76.4 76.9 60 99.3 44.7
             C 77 64.8 57.1 77.1 28.6 80.7 Z"
          fill="url(#trailUpper)"/>
    <path d="M 32.2 83.6 C 55.5 79.8 80.9 59.6 99.3 44.7
             C 81.7 64.8 61.4 82.9 35.2 87.6 Z"
          fill="url(#trailLower)"/>
    <path d="M 34.5 86.6 C 63.1 78.8 85.5 57.2 99.3 44.7
             C 84.4 61.9 64.5 80.6 36.6 89.2 Z"
          fill="#fff" opacity=".28"/>
  </g>

  <!-- A folded paper plane points towards the upper-right corner. -->
  <g>
    <path d="M 94.1 39.9 L 110.1 34.3
             C 111.3 33.9 111.8 34.5 111.4 35.6
             L 104.9 49.9 C 104.3 51.3 103.7 51.4 103 50.1
             L 99.8 42.3 L 94.3 41.3
             C 92.9 41 93 40.3 94.1 39.9 Z"
          fill="url(#paper)"/>
    <path d="M 99.8 42.3 L 110.9 34.6
             L 104.9 49.9 C 104.3 51.3 103.7 51.4 103 50.1 Z"
          fill="url(#paperFold)"/>
    <path d="M 94.1 39.9 L 110.1 34.3
             L 99.8 42.3 L 94.3 41.3 C 92.9 41 93 40.3 94.1 39.9 Z"
          fill="#fff"/>
  </g>
</svg>
